<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CCTV Estimate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">CCTV Estimate</a>
    </div>
</nav>
<div class="container">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Select NVR</h5>
                    <select id="nvr" class="form-select">
                        {% for nvr in nvrs %}
                        <option value="{{ nvr.price }}">{{ nvr.name }} - AED {{ nvr.price }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Select HDD</h5>
                    <select id="hdd" class="form-select">
                        {% for hdd in hdds %}
                        <option value="{{ hdd.price }}">{{ hdd.name }} - AED {{ hdd.price }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Cameras</h5>
                    {% for cam in cams %}
                    <div class="form-check">
                        <input class="form-check-input cam-checkbox" type="checkbox" value="{{ cam.price }}" id="cam{{ cam.id }}">
                        <label class="form-check-label" for="cam{{ cam.id }}">{{ cam.name }} - AED {{ cam.price }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">Storage Size (TB)</h5>
                    <input type="range" class="form-range" min="1" max="20" step="1" value="1" id="storageSlider">
                    <div class="d-flex justify-content-between"><span>1</span><span id="storageValue">1</span><span>20</span></div>
                </div>
            </div>
            <div class="card text-center">
                <div class="card-body">
                    <h4 class="card-title mb-0">Total: AED <span id="total">0.00</span></h4>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'app.js' %}"></script>
</body>
</html>
